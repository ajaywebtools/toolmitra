<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR Code Generator - ToolMitra</title>
<meta name="description" content="Create QR codes online for free with ToolMitra.">

<style>
body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#f5f7fb;
  color:#222;
}

header{
  background:linear-gradient(135deg,#2563eb,#4f46e5);
  color:white;
  text-align:center;
  padding:35px 15px;
}

.container{
  max-width:800px;
  margin:30px auto;
  padding:15px;
}

.card{
  background:white;
  padding:25px;
  border-radius:16px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
  text-align:center;
}

input{
  width:90%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:16px;
  margin:15px 0;
}

button{
  background:#2563eb;
  color:white;
  border:none;
  padding:12px 20px;
  border-radius:8px;
  cursor:pointer;
  font-size:15px;
}

#qrResult{
  margin-top:25px;
}

#qrResult img{
  max-width:250px;
  border:10px solid white;
  box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.download{
  display:inline-block;
  margin-top:15px;
  background:#16a34a;
  color:white;
  padding:10px 15px;
  border-radius:7px;
  text-decoration:none;
}

.back{
  display:inline-block;
  margin-top:25px;
  color:#2563eb;
  text-decoration:none;
}
</style>
</head>

<body>

<header>
<h1>📱 QR Code Generator</h1>
<p>Create QR codes instantly</p>
</header>

<div class="container">

<div class="card">

<h2>Generate QR Code</h2>

<p>Enter text or a website URL below.</p>

<input type="text" id="qrText" placeholder="Enter text or URL">

<br>

<button onclick="generateQR()">Generate QR Code</button>

<div id="qrResult"></div>

<a class="back" href="index.html">← Back to ToolMitra</a>

</div>

</div>

<script>

function generateQR(){

const text=document.getElementById('qrText').value.trim();

const result=document.getElementById('qrResult');

if(!text){
alert('Please enter text or a URL.');
return;
}

const qrUrl=
'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+
encodeURIComponent(text);

result.innerHTML=
'<img src="'+qrUrl+'" alt="Generated QR Code">'+
'<br>'+
'<a class="download" href="'+qrUrl+'" download="toolmitra-qr-code.png">⬇️ Download QR Code</a>';

}

</script>

</body>
</html>
