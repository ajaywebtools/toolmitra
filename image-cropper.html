<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Image Cropper - ToolMitra</title>
<meta name="description" content="Crop images online for free with ToolMitra.">

<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f7fb;color:#222}
header{background:linear-gradient(135deg,#2563eb,#4f46e5);color:white;text-align:center;padding:35px 15px}
.container{max-width:800px;margin:30px auto;padding:15px}
.card{background:white;padding:25px;border-radius:16px;box-shadow:0 4px 15px rgba(0,0,0,.08);text-align:center}
input{margin:20px 0}
button{background:#2563eb;color:white;border:0;padding:12px 20px;border-radius:8px;cursor:pointer;font-size:15px;margin:5px}
#preview{max-width:100%;margin-top:20px;border-radius:8px}
.download{display:inline-block;margin-top:15px;background:#16a34a;color:white;padding:10px 15px;border-radius:7px;text-decoration:none}
.back{display:inline-block;margin-top:25px;color:#2563eb;text-decoration:none}
</style>
</head>

<body>

<header>
<h1>✂️ Image Cropper</h1>
<p>Crop your images online for free</p>
</header>

<div class="container">
<div class="card">

<h2>Crop Image</h2>

<input type="file" id="imageInput" accept="image/*">

<br>

<label>Width:</label>
<input type="number" id="cropWidth" placeholder="Width">

<br>

<label>Height:</label>
<input type="number" id="cropHeight" placeholder="Height">

<br>

<button onclick="cropImage()">Crop Image</button>

<div id="result"></div>

<a class="back" href="index.html">← Back to ToolMitra</a>

</div>
</div>

<script>

let img=new Image();

document.getElementById('imageInput').addEventListener('change',function(){

const file=this.files[0];

if(!file)return;

const reader=new FileReader();

reader.onload=function(e){

img.onload=function(){

document.getElementById('result').innerHTML=
'<img id="preview" src="'+e.target.result+'">';

};

img.src=e.target.result;

};

reader.readAsDataURL(file);

});

function cropImage(){

const width=parseInt(document.getElementById('cropWidth').value);
const height=parseInt(document.getElementById('cropHeight').value);

if(!document.getElementById('imageInput').files.length){
alert('Please select an image first.');
return;
}

if(!width || !height || width<=0 || height<=0){
alert('Please enter valid width and height.');
return;
}

if(width>img.width || height>img.height){
alert('Crop size cannot be larger than the original image.');
return;
}

const canvas=document.createElement('canvas');

canvas.width=width;
canvas.height=height;

const ctx=canvas.getContext('2d');

ctx.drawImage(
img,
0,
0,
width,
height,
0,
0,
width,
height
);

const output=canvas.toDataURL('image/png');

document.getElementById('result').innerHTML=
'<img id="preview" src="'+output+'">'+
'<br>'+
'<a class="download" href="'+output+'" download="cropped-image.png">⬇️ Download Cropped Image</a>';

}

</script>

</body>
</html>
