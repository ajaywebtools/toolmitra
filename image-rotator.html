<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Image Rotator - ToolMitra</title>
<meta name="description" content="Rotate images online for free with ToolMitra.">

<style>
body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#f5f7fb;
  color:#222;
}

header{
  background:linear-gradient(135deg,#2563eb,#4f46e5);
  color:white;
  text-align:center;
  padding:35px 15px;
}

.container{
  max-width:800px;
  margin:30px auto;
  padding:15px;
}

.card{
  background:white;
  padding:25px;
  border-radius:16px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
  text-align:center;
}

input{
  margin:20px 0;
}

button{
  background:#2563eb;
  color:white;
  border:none;
  padding:12px 20px;
  border-radius:8px;
  cursor:pointer;
  font-size:15px;
  margin:5px;
}

#preview{
  max-width:100%;
  margin-top:20px;
  border-radius:8px;
}

.download{
  display:inline-block;
  margin-top:15px;
  background:#16a34a;
  color:white;
  padding:10px 15px;
  border-radius:7px;
  text-decoration:none;
}

.back{
  display:inline-block;
  margin-top:25px;
  color:#2563eb;
  text-decoration:none;
}
</style>
</head>

<body>

<header>
  <h1>🔄 Image Rotator</h1>
  <p>Rotate your images easily online</p>
</header>

<div class="container">

<div class="card">

<h2>Rotate Image</h2>

<input type="file" id="imageInput" accept="image/*">

<br>

<button onclick="rotateImage(90)">↻ Rotate 90°</button>

<button onclick="rotateImage(180)">↻ Rotate 180°</button>

<button onclick="rotateImage(270)">↻ Rotate 270°</button>

<div id="result"></div>

<a class="back" href="index.html">← Back to ToolMitra</a>

</div>

</div>

<script>

let originalImage=new Image();

document.getElementById('imageInput').addEventListener('change',function(){

const file=this.files[0];

if(!file)return;

const reader=new FileReader();

reader.onload=function(e){

originalImage.onload=function(){

document.getElementById('result').innerHTML=
'<img id="preview" src="'+e.target.result+'">';

};

originalImage.src=e.target.result;

};

reader.readAsDataURL(file);

});

function rotateImage(angle){

if(!document.getElementById('imageInput').files.length){
alert('Please select an image first.');
return;
}

const canvas=document.createElement('canvas');
const ctx=canvas.getContext('2d');

const radians=angle*Math.PI/180;

if(angle===90 || angle===270){

canvas.width=originalImage.height;
canvas.height=originalImage.width;

}else{

canvas.width=originalImage.width;
canvas.height=originalImage.height;

}

ctx.translate(canvas.width/2,canvas.height/2);
ctx.rotate(radians);

ctx.drawImage(
originalImage,
-originalImage.width/2,
-originalImage.height/2
);

const output=canvas.toDataURL('image/png');

document.getElementById('result').innerHTML=
'<img id="preview" src="'+output+'">'+
'<br>'+
'<a class="download" href="'+output+'" download="rotated-image.png">⬇️ Download Rotated Image</a>';

}

</script>

</body>
</html>
