<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToolMitra - Free Online Tools</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #2563eb;
      color: white;
      text-align: center;
      padding: 35px 15px;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 34px;
    }

    header p {
      margin: 0;
      font-size: 17px;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 15px;
    }

    .tools {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .tool {
      background: white;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .tool h2 {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .tool p {
      color: #666;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 11px 18px;
      border-radius: 8px;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #666;
    }
  </style>
</head>

<body>

  <header>
    <h1>🛠️ ToolMitra</h1>
    <p>Free Online Tools for Everyone</p>
  </header>

  <div class="container">

    <div class="tools">

      <div class="tool">
        <h2>📸 Image Compressor</h2>
        <p>Reduce image size quickly and easily.</p>
        <button>Open Tool</button>
      </div>

      <div class="tool">
        <h2>📏 Image Resizer</h2>
        <p>Resize your images online.</p>
        <button>Coming Soon</button>
      </div>

      <div class="tool">
        <h2>🧮 Percentage Calculator</h2>
        <p>Calculate percentages easily.</p>
        <button>Coming Soon</button>
      </div>

      <div class="tool">
        <h2>🎂 Age Calculator</h2>
        <p>Calculate your exact age.</p>
        <button>Coming Soon</button>
      </div>

    </div>

  </div>

  <footer>
    © 2026 ToolMitra. Free online tools.
  </footer>

</body>
</html>
