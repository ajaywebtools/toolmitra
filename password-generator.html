<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Password Generator - ToolMitra</title>
<meta name="description" content="Generate strong random passwords online for free with ToolMitra.">

<style>
body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#f5f7fb;
  color:#222;
}

header{
  background:linear-gradient(135deg,#2563eb,#4f46e5);
  color:white;
  text-align:center;
  padding:35px 15px;
}

.container{
  max-width:800px;
  margin:30px auto;
  padding:15px;
}

.card{
  background:white;
  padding:25px;
  border-radius:16px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
  text-align:center;
}

input[type="number"]{
  width:80px;
  padding:10px;
  margin:10px;
}

label{
  display:block;
  margin:12px;
}

button{
  background:#2563eb;
  color:white;
  border:none;
  padding:12px 20px;
  border-radius:8px;
  cursor:pointer;
  font-size:15px;
  margin-top:15px;
}

#password{
  margin-top:20px;
  padding:15px;
  background:#f1f5f9;
  border-radius:8px;
  word-break:break-all;
  font-size:18px;
  font-weight:bold;
}

.copy{
  background:#16a34a;
}

.back{
  display:inline-block;
  margin-top:25px;
  color:#2563eb;
  text-decoration:none;
}
</style>
</head>

<body>

<header>
<h1>🔐 Password Generator</h1>
<p>Create a strong random password</p>
</header>

<div class="container">

<div class="card">

<h2>Generate Password</h2>

<label>
Password Length:
<input type="number" id="length" value="12" min="4" max="50">
</label>

<label>
<input type="checkbox" id="uppercase" checked>
Include Uppercase Letters
</label>

<label>
<input type="checkbox" id="numbers" checked>
Include Numbers
</label>

<label>
<input type="checkbox" id="symbols" checked>
Include Symbols
</label>

<button onclick="generatePassword()">Generate Password</button>

<div id="password">Your password will appear here</div>

<button class="copy" onclick="copyPassword()">Copy Password</button>

<a class="back" href="index.html">← Back to ToolMitra</a>

</div>

</div>

<script>

function generatePassword(){

const length=parseInt(document.getElementById('length').value);

const useUpper=document.getElementById('uppercase').checked;

const useNumbers=document.getElementById('numbers').checked;

const useSymbols=document.getElementById('symbols').checked;

let chars='abcdefghijklmnopqrstuvwxyz';

if(useUpper){
chars+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
}

if(useNumbers){
chars+='0123456789';
}

if(useSymbols){
chars+='!@#$%^&*()_+-=[]{}';
}

let password='';

for(let i=0;i<length;i++){

const randomIndex=Math.floor(Math.random()*chars.length);

password+=chars[randomIndex];

}

document.getElementById('password').textContent=password;

}

function copyPassword(){

const password=document.getElementById('password').textContent;

if(!password || password==='Your password will appear here'){
alert('Generate a password first.');
return;
}

navigator.clipboard.writeText(password);

alert('Password copied!');

}

</script>

</body>
</html>
